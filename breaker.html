  }

  var scale=1, dpr=1, wrap=document.getElementById('wrap');
  function resize(){ dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
    var rect=wrap.getBoundingClientRect();
    // No lower clamp: on a short phone the field has to shrink to fit, or the
    // paddle ends up cropped off the bottom of the viewport.
    scale=Math.min(rect.width/VW, rect.height/VH)*0.97;
    if(!isFinite(scale) || scale<=0) scale=1;
    canvas.style.width=(VW*scale)+'px'; canvas.style.height=(VH*scale)+'px';
    canvas.width=Math.round(VW*scale*dpr); canvas.height=Math.round(VH*scale*dpr); }
  window.addEventListener('resize',resize); resize();
  function toVirtualX(clientX){ var r=canvas.getBoundingClientRect(); return ((clientX-r.left)/r.width)*VW; }

  // ── the wall ──
  function fieldWidth(){ return VW - WALL*2 - 10; }
  function fieldX(){ return WALL + 5; }
  function newBrick(c,y){
    return { x:fieldX()+c*(BRICK_W+BRICK_GAP), y:y, w:BRICK_W, h:BRICK_H,
      alive:true, hp:1, max:1, tnt:false, bonus:false, power:false,
      armour:false, shield:false, spawnT:0, hurtT:0,
      regen:false, sentry:false, ghost:false, ghostT:0, fireT:0, idleT:0 };
  }
  // A phased-out ghost is untouchable: ball, shots and blasts all pass through.
  function brickSolid(b){ return b.alive && !(b.ghost && b.ghostT<GHOST_OUT); }
  var GHOST_CYCLE=240, GHOST_OUT=90;   // of each cycle, this many frames spent phased out
  function brickFromChar(ch,c,y,bonusHp){
    var b=newBrick(c,y);
    if(ch==='=') b.hp=2;
    else if(ch==='%') b.hp=3;
    else if(ch==='X'){ b.hp=6; b.armour=true; }
    else if(ch==='!') b.tnt=true;
    else if(ch==='$') b.bonus=true;
    else if(ch==='*') b.power=true;
    else if(ch==='R'){ b.regen=true; b.hp=2; }
    else if(ch==='S'){ b.sentry=true; b.hp=2; b.fireT=200+((Math.random()*260)|0); }
    else if(ch==='~'){ b.ghost=true; b.ghostT=(Math.random()*GHOST_CYCLE)|0; }
    if(!b.tnt && !b.bonus && !b.power && !b.ghost) b.hp += bonusHp||0;
    b.max=b.hp;
    return b;
  }
  function spawnRow(y){
    var pool=ROW_POOLS[game.tier], pat=pool[(Math.random()*pool.length)|0];
    for(var c=0;c<COLS;c++){
      var ch=pat[c]; if(ch==='.') continue;
      game.bricks.push(brickFromChar(ch,c,y,game.hpBonus));
    }
    game.rowsSpawned++;
    game.lastRowY=y;
  }
  function waveBricksAlive(){ var n=0;
    for(var i=0;i<game.bricks.length;i++){ var b=game.bricks[i]; if(b.alive && !b.shield) n++; }
    return n; }
  function pruneBricks(){ for(var i=game.bricks.length-1;i>=0;i--) if(!game.bricks[i].alive) game.bricks.splice(i,1); }

  function updateWall(){
    var d=game.descend, i, b;
    // The sway is applied as a delta so spawn positions stay on the grid.
    var dx=0;
    if(game.driftAmp){ game.driftT+=0.02;
      var off=Math.sin(game.driftT)*game.driftAmp;
      dx=off-game.driftPrev; game.driftPrev=off; }
    for(i=0;i<game.bricks.length;i++){ b=game.bricks[i];
      if(b.spawnT>0) b.spawnT--; if(b.hurtT>0) b.hurtT--;
      if(b.shield) continue;
      b.y+=d; b.x+=dx;
      if(!b.alive) continue;
      if(b.ghost){ b.ghostT=(b.ghostT+1)%GHOST_CYCLE; }
      if(b.regen){ b.idleT++;
        if(b.hp<b.max && b.idleT>=210){ b.hp++; b.idleT=0; spawnDust(b.x+b.w/2,b.y+b.h/2,3); } }
      if(b.sentry && game.state===STATE.PLAY && b.y>TOP_Y+4 && bolts.length<8){
        if(--b.fireT<=0){ b.fireT=280+((Math.random()*220)|0);
          spawnBolt(b.x+b.w/2, b.y+b.h, false, 1.6); } }
    }
    if(game.phase!==PHASE.WAVE) return;
    game.lastRowY+=d;
    if(game.rowsSpawned<game.rowsTotal && game.lastRowY>=SPAWN_Y+game.rowGap*ROW_STEP){
      var cfg=LEVELS[game.level];
      if(cfg.inv && !game.invDone && game.rowsSpawned>=cfg.inv.at){ game.invDone=true; spawnInvaders(cfg.inv); game.lastRowY=SPAWN_Y; }
      else spawnRow(SPAWN_Y);
    }
    if(game.rowsSpawned>=game.rowsTotal && waveBricksAlive()===0 && invadersAlive()===0) startBossPhase();
  }
  function checkBreach(){
    if(game.state!==STATE.PLAY) return;
    var hit=false, i;
    for(i=0;i<game.bricks.length;i++){ var b=game.bricks[i];
      if(b.alive && !b.shield && b.y+b.h>=DANGER_Y){ hit=true; break; } }
    if(!hit) for(i=0;i<invaders.length;i++){ var v=invaders[i];
      if(v.alive && v.y+INV_H>=DANGER_Y){ hit=true; break; } }
    if(!hit) return;
    // Burn off the bottom of the wall and shove the rest back up.
    for(i=game.bricks.length-1;i>=0;i--){ var br=game.bricks[i];
      if(!br.alive || br.shield) continue;
      if(br.y+br.h>DANGER_Y-ROW_STEP*2){ spawnDust(br.x+br.w/2, br.y+br.h/2, 6); br.alive=false; }
      else br.y-=ROW_STEP*3;
    }
    for(i=0;i<invaders.length;i++){ if(invaders[i].alive && invaders[i].y+INV_H>DANGER_Y-ROW_STEP*2) invaders[i].alive=false; }
    invGroup.dy-=ROW_STEP*3;
    game.lastRowY-=ROW_STEP*3;
    pruneBricks(); syncInvaders();
    game.msg='BREACH'; game.msgSub=''; game.msgT=50;
    damage(DMG_BREACH);
  }

  // ── invaders ──
  function spawnInvaders(cfg){
    var n=cfg.n, perRow=Math.min(5,n);
    var span=fieldWidth()/perRow;
    invaders=[];
    for(var i=0;i<n;i++){
      var c=i%perRow, r=(i/perRow)|0;
      invaders.push({ bx: fieldX()+c*span+(span-INV_W)/2, by: SPAWN_Y - r*(INV_H+6),
                      x:0, y:0, hp:cfg.hp, max:cfg.hp, alive:true, hurtT:0 });
    }
    invGroup = { dir:1, dx:0, dy:0, speed:(0.5+game.level*0.03)*SPEED_SCALE,
                 fire:Math.max(60, 150-game.level*6), tick:0, aimed:game.level>=4 };
    syncInvaders();
    blip(140,0.2,'sawtooth',0.05);
  }
  function syncInvaders(){ for(var i=0;i<invaders.length;i++){ var v=invaders[i];
    v.x=v.bx+invGroup.dx; v.y=v.by+invGroup.dy; } }
  function invadersAlive(){ var n=0; for(var i=0;i<invaders.length;i++) if(invaders[i].alive) n++; return n; }
  function killInvader(v){
    if(v.hp>0){ credit(v.hp); v.hp=0; }   // pierce / blast kills bypass hurtInvader
    v.alive=false; game.score += 60*game.mult;
    spawnDust(v.x+INV_W/2, v.y+INV_H/2, 12); shake(4,2);
    blip(180,0.10,'sawtooth',0.06);
    if(Math.random()<0.25) spawnDrop(v.x+INV_W/2, v.y+INV_H/2, true);
  }
  function hurtInvader(v,dmg){
    credit(Math.min(v.hp,dmg));
    v.hp-=dmg; v.hurtT=5;
    if(v.hp<=0) killInvader(v);
    else { spawnDust(v.x+INV_W/2, v.y+INV_H/2, 3); game.score+=10; blip(280,0.04,'square',0.05); }
  }
  function updateInvaders(){
    if(invaders.length===0) return;
    var alive=invadersAlive();
    for(var i=0;i<invaders.length;i++) if(invaders[i].hurtT>0) invaders[i].hurtT--;
    if(alive===0) return;
    var lo=Infinity, hi=-Infinity;
    for(i=0;i<invaders.length;i++){ var v=invaders[i]; if(!v.alive) continue;
      if(v.bx<lo) lo=v.bx; if(v.bx+INV_W>hi) hi=v.bx+INV_W; }
    // Thinning the squadron speeds up the survivors, like the arcade original.
    var sp = invGroup.speed * (1 + (invaders.length-alive)/invaders.length);
    invGroup.dx += invGroup.dir*sp;
    if(lo+invGroup.dx < fieldX()){ invGroup.dx=fieldX()-lo; invGroup.dir=1; }
    else if(hi+invGroup.dx > fieldX()+fieldWidth()){ invGroup.dx=fieldX()+fieldWidth()-hi; invGroup.dir=-1; }
    invGroup.dy += game.descend;
    syncInvaders();
    if(game.state!==STATE.PLAY) return;
    if(++invGroup.tick >= invGroup.fire){ invGroup.tick=0; fireFromSquadron(); }
  }
  function fireFromSquadron(){
    var live=[]; for(var i=0;i<invaders.length;i++) if(invaders[i].alive) live.push(invaders[i]);
    if(!live.length) return;
    var v=live[(Math.random()*live.length)|0];
    spawnBolt(v.x+INV_W/2, v.y+INV_H, invGroup.aimed, 2.0);
  }

  // ── enemy fire ──
  function spawnBolt(x,y,aimed,sp){
    sp=(sp||2.0)*SPEED_SCALE;
    var vx=0, vy=sp;
    if(aimed){ var dx=paddle.x-x, dy=PADDLE_Y-y, m=Math.hypot(dx,dy)||1;
      vx=dx/m*sp*0.55; vy=Math.abs(dy/m*sp); }
    bolts.push({ x:x, y:y, vx:vx, vy:vy, t:0 });
    blip(150,0.05,'sawtooth',0.04);
  }
  function updateBolts(){
    for(var i=bolts.length-1;i>=0;i--){ var bo=bolts[i];
      var py=bo.y; bo.x+=bo.vx; bo.y+=bo.vy; bo.t++;
      if(bo.x<WALL||bo.x>VW-WALL){ bolts.splice(i,1); continue; }
      if(fx.safety>0 && py<NET_Y && bo.y>=NET_Y){    // the net eats incoming fire
        spawnDust(bo.x,NET_Y,4); blip(500,0.04,'sine',0.05); bolts.splice(i,1); continue; }
      if(game.state===STATE.PLAY && bo.y>=PADDLE_Y-2 && bo.y<=PADDLE_Y+PADDLE_H+2 &&
         Math.abs(bo.x-paddle.x)<=PADDLE_W/2+2){
        bolts.splice(i,1); spawnDust(bo.x,PADDLE_Y,14); damage(DMG_BOLT); return; }
      if(bo.y>VH) bolts.splice(i,1);
    }
  }

  // ── the paddle gun ──
  //  A wide paddle can't travel as far into the corners, which used to put the
  //  outer brick columns out of the centre gun's reach. It gains a muzzle at
  //  each edge instead, so wider means three firing lines rather than a blind spot.
  function muzzleOffsets(){
    if(fx.bigpad>0){ var e=PADDLE_W/2-3; return [-e, 0, e]; }
    return [0];
  }
  function updateGun(){
    if(game.state!==STATE.PLAY) return;
    var iv=gunInterval(); if(fx.laser>0) iv=Math.max(9, iv*0.6);
    if(++gunTick < iv) return;
    gunTick=0;
    var dmg=gunDamage(), off=muzzleOffsets();
    for(var m=0;m<off.length;m++)
      shots.push({ x:paddle.x+off[m], y:PADDLE_Y-2, vx:0, dmg:dmg });
    if(fx.laser>0){
      shots.push({ x:paddle.x-PADDLE_W*0.34, y:PADDLE_Y, vx:-0.9, dmg:dmg });
      shots.push({ x:paddle.x+PADDLE_W*0.34, y:PADDLE_Y, vx:0.9, dmg:dmg });
    }
    blip(880,0.03,'square',0.035);
  }
  function updateShots(){
    dmgSrc='gun';
    for(var i=shots.length-1;i>=0;i--){ var s=shots[i];
      s.y-=6*SPEED_SCALE; s.x+=s.vx;
      if(s.y<TOP_Y-4 || s.x<WALL || s.x>VW-WALL){ shots.splice(i,1); continue; }
      var hit=false, k;
      for(k=0;k<invaders.length;k++){ var v=invaders[k]; if(!v.alive) continue;
        if(s.x>=v.x && s.x<=v.x+INV_W && s.y<=v.y+INV_H && s.y>=v.y-6){ hurtInvader(v,s.dmg); hit=true; break; } }
      if(!hit && boss && !boss.dead && !boss.entering &&
         s.x>=boss.x && s.x<=boss.x+boss.w && s.y<=boss.y+boss.h && s.y>=boss.y-6){ damageBoss(s.dmg); hit=true; }
      if(!hit) for(k=0;k<game.bricks.length;k++){ var b=game.bricks[k]; if(!brickSolid(b)) continue;
        if(s.x>=b.x && s.x<=b.x+b.w && s.y<=b.y+b.h && s.y>=b.y-6){ damageBrick(b,s.dmg); hit=true; break; } }
      if(hit){ spawnDust(s.x,s.y,2); shots.splice(i,1); }
    }
  }

  // ── boss ──
  function bossSprite(key){ return key==='pike' ? PIKE : FROG; }
  function startBossPhase(){
    var cfg=LEVELS[game.level], meta=BOSSES[cfg.boss];
    game.phase=PHASE.BOSS;
    var spr=bossSprite(cfg.boss);
    var w=spr[0].length*meta.unit, h=spr.length*meta.unit;
    boss = { cfg:meta, key:cfg.boss, spr:spr, w:w, h:h, x:(VW-w)/2, y:-h-4, dir:1,
             hp:cfg.bossHp, maxHp:cfg.bossHp, t:0, hurtT:0, invT:0, entering:true,
             shootT:(meta.shootEvery*0.6)|0, shieldT:meta.shieldEvery,
             diving:0, diveT:meta.diveEvery||0, dead:false };
    game.msg='BOSS'; game.msgSub=meta.name; game.msgT=80;
    flash(10); shake(8,3); blip(110,0.4,'sawtooth',0.07);
  }
  // A fan of bolts spread across the down arc.
  function sprayBolts(cx,cy,n,sp){
    for(var i=0;i<n;i++){
      var a=Math.PI/2 + (i-(n-1)/2)*0.32, v=(sp||2.2)*SPEED_SCALE;
      bolts.push({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0 });
    }
    blip(140,0.10,'sawtooth',0.05);
  }
  function shieldSlotFree(c,r){
    var y=SHIELD_Y+r*ROW_STEP, x=fieldX()+c*(BRICK_W+BRICK_GAP);
    for(var i=0;i<game.bricks.length;i++){ var b=game.bricks[i];
      if(b.alive && Math.abs(b.x-x)<1 && Math.abs(b.y-y)<1) return false; }
    return true;
  }
  function addShieldBrick(c,r){
    var b=newBrick(c, SHIELD_Y+r*ROW_STEP);
    b.shield=true; b.spawnT=14;
    b.hp=2+Math.floor(game.level/4); b.max=b.hp;
    game.bricks.push(b);
  }
  function buildShieldWall(count){
    for(var k=game.bricks.length-1;k>=0;k--)
      if(game.bricks[k].shield && !game.bricks[k].alive) game.bricks.splice(k,1);
    var slots=[], rows=boss.cfg.shieldRows;
    for(var r=0;r<rows;r++) for(var c=0;c<COLS;c++) if(shieldSlotFree(c,r)) slots.push([c,r]);
    for(var i=slots.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=slots[i]; slots[i]=slots[j]; slots[j]=t; }
    for(i=0;i<Math.min(count,slots.length);i++) addShieldBrick(slots[i][0], slots[i][1]);
  }
  // The invulnerability window exists so one ball can't register several hits
  // across its collision substeps. Gun shots are already discrete, so they are
  // never absorbed by it.
  function damageBoss(n,fromBall){
    if(!boss || boss.dead || boss.entering) return;
    if(fromBall){ if(boss.invT>0) return; boss.invT=6; }
    credit(Math.min(boss.hp,n));
    boss.hp-=n; boss.hurtT=10;
    shake(5,3); blip(160,0.09,'square',0.06);
    spawnDust(boss.x+boss.w/2, boss.y+boss.h/2, 6);
    if(boss.hp<=0){ boss.hp=0; boss.dead=true; killBoss(); }
  }
  function killBoss(){
    shake(16,7); flash(16); blip(90,0.5,'sawtooth',0.08);
    for(var i=0;i<60;i++){ var a=Math.random()*Math.PI*2, s=1+Math.random()*4;
      particles.push({ x:boss.x+boss.w/2, y:boss.y+boss.h/2, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:24+Math.random()*26, max:50, size:1+(Math.random()<0.5?1:0) }); }
    game.score += 500 + game.level*150;
    bolts=[];
    levelCleared();
  }
  function updateBoss(){
    if(!boss) return;
    boss.t++; if(boss.hurtT>0) boss.hurtT--; if(boss.invT>0) boss.invT--;
    if(boss.dead) return;
    if(boss.entering){
      boss.y+=1.4;
      if(boss.y>=TOP_Y+boss.cfg.top){ boss.y=TOP_Y+boss.cfg.top; boss.entering=false;
        buildShieldWall(boss.cfg.shieldOpen);
        for(var s=0;s<game.bricks.length;s++) game.bricks[s].spawnT=0; }
      return;
    }
    var frac=boss.hp/boss.maxHp;
    var rage = frac<0.34 ? 1.7 : (frac<0.67 ? 1.3 : 1);
    var cx, cy;
    // Dive: swoop into the open field, unload a fan at close range, climb back.
    // The boss is fully hittable the whole way down, so it's a trade.
    if(boss.diving===1){
      boss.y+=3.0;
      boss.x+=(paddle.x-boss.w/2-boss.x)*0.04;   // leans toward the paddle
      if(boss.y>=DIVE_Y){
        cx=boss.x+boss.w/2; cy=boss.y+boss.h;
        sprayBolts(cx, cy, boss.cfg.spray||3, 2.4);
        boss.diving=2; shake(6,3);
      }
      return;
    }
    if(boss.diving===2){
      boss.y-=2.0;
      if(boss.y<=TOP_Y+boss.cfg.top){ boss.y=TOP_Y+boss.cfg.top; boss.diving=0; boss.diveT=boss.cfg.diveEvery; }
      return;
    }
    boss.x += boss.dir*boss.cfg.speed*rage*SPEED_SCALE;
    if(boss.x<WALL+3){ boss.x=WALL+3; boss.dir=1; }
    else if(boss.x+boss.w>VW-WALL-3){ boss.x=VW-WALL-3-boss.w; boss.dir=-1; }
    boss.y = TOP_Y + boss.cfg.top + Math.sin(boss.t*0.04)*3;
    if(game.state!==STATE.PLAY) return;
    if(boss.cfg.dive && frac<=boss.cfg.diveBelow && --boss.diveT<=0){
      boss.diving=1; blip(300,0.2,'sawtooth',0.06); shake(4,2);
      return;
    }
    if(--boss.shootT<=0){
      boss.shootT=Math.max(22,(boss.cfg.shootEvery/rage)|0);
      cx=boss.x+boss.w/2; cy=boss.y+boss.h;
      spawnBolt(cx, cy, boss.cfg.aimed, 2.4);
      if(rage>1.2){
        if(boss.cfg.spray) sprayBolts(cx, cy, boss.cfg.spray, 2.1);
        else { spawnBolt(cx-boss.w*0.3, cy, false, 2.2); spawnBolt(cx+boss.w*0.3, cy, false, 2.2); }
      }
    }
    if(--boss.shieldT<=0){
      boss.shieldT=Math.max(70,(boss.cfg.shieldEvery/rage)|0);
      buildShieldWall(boss.cfg.shieldPer);
      blip(420,0.07,'triangle',0.05);
      if(boss.cfg.minions && invadersAlive()===0) spawnBossMinions(boss.cfg.minions);
    }
  }
  function spawnBossMinions(n){
    invaders=[];
    var span=fieldWidth()/n, mhp=2+Math.floor(game.level/6);
    for(var i=0;i<n;i++)
      invaders.push({ bx: fieldX()+i*span+(span-INV_W)/2, by: SHIELD_Y+ROW_STEP*3,
                      x:0, y:0, hp:mhp, max:mhp, alive:true, hurtT:0 });
    invGroup = { dir:1, dx:0, dy:0, speed:0.9*SPEED_SCALE, fire:120, tick:0, aimed:true };
    syncInvaders();
  }

  // ── balls ──
  function makeBall(stuck){ return { x:paddle.x, y:PADDLE_Y-BALL_R-1, vx:0, vy:0,
    squash:0, sqx:0, sqy:1, trail:[], stuck:!!stuck, offset:0 }; }
  function resetServe(){ balls=[ makeBall(true) ]; tongue=null; shots=[]; }
  function launchAll(){
    var any=false;
    for(var i=0;i<balls.length;i++){ var b=balls[i]; if(b.stuck){
      var hit=Math.max(-0.8,Math.min(0.8, b.offset/(PADDLE_W/2)));
      var ang=-Math.PI/2 + hit*(Math.PI/3), sp=levelSpeed*speedMul;
      b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.stuck=false; any=true;
    }}
    if(any){ game.state=STATE.PLAY; blip(560,0.05,'square'); }
  }
  function anyStuck(){ for(var i=0;i<balls.length;i++) if(balls[i].stuck) return true; return false; }
  function splitBalls(){
    var moving=balls.filter(function(b){ return !b.stuck; });
    if(moving.length===0){ launchAll(); moving=balls.filter(function(b){ return !b.stuck; }); }
    var add=[];
    for(var i=0;i<moving.length;i++){ var b=moving[i];
      for(var k=0;k<2;k++){ if(balls.length+add.length>=7) break;
        var ang=Math.atan2(b.vy,b.vx)+(k===0?0.42:-0.42), sp=levelSpeed*speedMul;
        add.push({ x:b.x, y:b.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
          squash:0, sqx:0, sqy:1, trail:[], stuck:false, offset:0 }); } }
    balls=balls.concat(add); shake(4,2); blip(720,0.08,'triangle',0.06);
  }
  function rescaleBalls(){ for(var i=0;i<balls.length;i++){ var b=balls[i]; if(b.stuck) continue;
    var m=Math.hypot(b.vx,b.vy); if(m<0.001) continue; var sp=levelSpeed*speedMul;
    b.vx=b.vx/m*sp; b.vy=b.vy/m*sp; } }

  // ── flow ──
  function flash(f){ game.flashT=Math.max(game.flashT,f); }
  function shake(t,mag){ if(t>game.shakeT){ game.shakeT=t; game.shakeMag=mag; } }
  function clearEffects(){ for(var i=0;i<FXKEYS.length;i++) fx[FXKEYS[i]]=0; speedMul=1; prevSpeedMul=1; shots=[]; }
  function resetCombo(){ game.combo=0; game.mult=1; }
  function saveHi(){ if(game.score>game.hi){ game.hi=game.score; saveNum('nakfrg_breaker_hi',game.hi); } }
  function unlock(n){ if(n>game.unlocked){ game.unlocked=Math.min(LEVELS.length-1,n); saveNum('nakfrg_breaker_unlocked',game.unlocked); } }
  function speedForLevel(n){ return Math.min(SPEED_CAP, (BASE_SPEED + n*0.10) * ballSpeedMul()); }

  function loadLevel(n){
    var cfg=LEVELS[n];
    BRICK_W=(fieldWidth()-(COLS-1)*BRICK_GAP)/COLS;
    BLAST_R=(BRICK_W+BRICK_GAP)*1.6;
    game.level=n; game.phase=PHASE.WAVE;
    game.bricks=[]; game.rowsSpawned=0; game.rowsTotal=cfg.rows;
    game.descend=cfg.descend*SPEED_SCALE; game.rowGap=cfg.gap;
    game.hpBonus=cfg.hpBonus; game.tier=cfg.tier; game.invDone=false;
    game.driftAmp=cfg.drift||0; game.driftT=0; game.driftPrev=0;
    invaders=[]; bolts=[]; boss=null; drops=[]; pendingBlasts=[];
    stat.gun=0; stat.ball=0; stat.frames=0;
    levelSpeed=speedForLevel(n);
    clearEffects(); resetCombo();
    for(var r=2;r>=0;r--) spawnRow(TOP_Y + r*ROW_STEP);   // a little wall to start on
    game.lastRowY=TOP_Y;
    game.hurtT=0;   // health carries across stages: a run is one health pool
    paddle.x=paddle.targetX=VW/2; resetServe(); gunTick=0;
    game.msg='LEVEL '+(n+1); game.msgSub=cfg.name; game.msgT=70;
    game.state=STATE.READY; flash(8);
  }
  function startGame(lv){
    lv=Math.max(0,Math.min(LEVELS.length-1,lv|0));
    game.score=0; game.earned=0; particles=[];
    game.hp=maxHp();          // a fresh run is the only full heal
    game.paused=false;
    loadLevel(lv);
  }
  function levelCleared(){
    if(game.state!==STATE.PLAY) return;
    game.state=STATE.CLEAR; game.msg='CLEARED'; game.msgSub=''; game.msgT=70;
    flash(12); blip(740,0.12,'triangle',0.07);
    var reward=12 + game.level*5 + Math.round(game.hp/maxHp()*20);
    game.earned=reward; game.flies+=reward; saveNum('nakfrg_breaker_flies',game.flies);
    saveHi(); unlock(game.level+1);
    setTimeout(function(){
      if(game.state!==STATE.CLEAR) return;
      sumIdx=1; game.state=STATE.SUMMARY; blip(620,0.08,'triangle',0.05);
    }, 1100);
  }
  function lastLevel(){ return game.level+1>=LEVELS.length; }
  function leaveSummary(){
    if(lastLevel()){ game.state=STATE.WIN; flash(16); blip(880,0.2,'triangle',0.07); }
    else { blip(700,0.08,'triangle',0.06); loadLevel(game.level+1); }
  }
  // Damage never interrupts the rally. The ball stays live, the wall keeps
  // creeping, and the only thing that changes is the health bar.
  function damage(n){
    if(game.state!==STATE.PLAY) return;
    game.hp-=n; game.hurtT=20;
    shake(6,3); flash(5); blip(190,0.20,'sawtooth',0.06);
    if(game.hp<=0){ game.hp=0; gameOver(); }
  }
  function gameOver(){
    game.state=STATE.OVER; saveHi(); flash(16); shake(14,6);
    blip(90,0.5,'sawtooth',0.07);
    clearEffects(); resetCombo(); drops=[]; bolts=[];
  }

  // ── particles / effects ──
  function spawnDust(x,y,n){ for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, s=0.6+Math.random()*1.8;
    particles.push({ x:x,y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-0.4, life:18+Math.random()*14, max:32, size:1+(Math.random()<0.4?1:0) }); } }
  function updateParticles(){ for(var i=particles.length-1;i>=0;i--){ var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; if(--p.life<=0) particles.splice(i,1); } }
  function impact(b,nx,ny){ b.squash=1; if(Math.abs(nx)>Math.abs(ny)){ b.sqx=0.65; b.sqy=1.3; } else { b.sqx=1.3; b.sqy=0.65; } }

  // ── drops ──
  function spawnDrop(x,y,goodOnly){ var type = goodOnly
      ? GOOD_DROPS[(Math.random()*GOOD_DROPS.length)|0]
      : DROP_TABLE[(Math.random()*DROP_TABLE.length)|0];
    drops.push({ x:x, y:y, vy:1.05, type:type, t:0 }); }
  function activate(type){
    var meta=PWR[type];
    blip(meta.good?660:300, 0.09, meta.good?'square':'sawtooth', 0.06);
    if(type==='double'){ splitBalls(); }
    else if(type==='repair'){ game.hp=Math.min(maxHp(), game.hp+REPAIR); flash(8); }
    else {
      if(type==='bigpad') fx.shortpad=0; if(type==='shortpad') fx.bigpad=0;
      if(type==='slow') fx.fast=0;       if(type==='fast') fx.slow=0;
      if(type==='bigball') fx.shrink=0;   if(type==='shrink') fx.bigball=0;
      fx[type]=meta.dur;
    }
    game.msgFx=meta.label; game.msgFxT=72; flash(5);
  }

  // ── brick destruction ──
  function detonate(cx,cy,r){ pendingBlasts.push({ x:cx, y:cy, r:r, src:dmgSrc }); }
  function explodeOnce(cx,cy,r){
    shake(7,5); flash(5); blip(120,0.16,'sawtooth',0.07);
    for(var i=0;i<14;i++){ var a=Math.random()*Math.PI*2, s=1+Math.random()*3;
      particles.push({ x:cx,y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:16+Math.random()*16, max:34, size:1+(Math.random()<0.5?1:0) }); }
    for(var j=0;j<game.bricks.length;j++){ var b=game.bricks[j];
      if(!brickSolid(b)) continue;
      var bx=b.x+b.w/2, by=b.y+b.h/2, dx=bx-cx, dy=by-cy;
      if(dx*dx+dy*dy<=r*r) breakBrick(b);
    }
    for(j=0;j<invaders.length;j++){ var v=invaders[j]; if(!v.alive) continue;
      var vx=v.x+INV_W/2-cx, vy=v.y+INV_H/2-cy;
      if(vx*vx+vy*vy<=r*r) killInvader(v);
    }
  }
  function runBlasts(){ var guard=0;
    while(pendingBlasts.length && guard++<120){ var p=pendingBlasts.shift(); dmgSrc=p.src; explodeOnce(p.x,p.y,p.r); } }

  function breakBrick(b){
    if(!b.alive) return;
    if(b.hp>0){ credit(b.hp); b.hp=0; }   // pierce / blast kills bypass damageBrick
    b.alive=false;
    game.combo++; game.mult=Math.min(5, 1+Math.floor(game.combo/4));
    var base = 10 + b.max*4 + (b.tnt?20:0) + (b.bonus?50:0);
    game.score += base * game.mult;
    spawnDust(b.x+b.w/2, b.y+b.h/2, b.bonus?14:6);
    if(b.bonus) spawnDrop(b.x+b.w/2, b.y+b.h/2, true);
    else if(b.power) spawnDrop(b.x+b.w/2, b.y+b.h/2, false);
    if(b.tnt) detonate(b.x+b.w/2, b.y+b.h/2, BLAST_R);
  }
  function damageBrick(b,dmg){
    credit(Math.min(b.hp,dmg));
    b.hp-=dmg; b.hurtT=4; b.idleT=0;
    if(b.hp<=0) breakBrick(b);
    else { game.score+=3; blip(300,0.03,'square',0.04); }
  }

  // ── physics ──
  function update(){
    game.flashT=Math.max(0,game.flashT-1);
    game.msgT=Math.max(0,game.msgT-1);
    game.msgFxT=Math.max(0,game.msgFxT-1);
    game.shakeT=Math.max(0,game.shakeT-1);
    game.hurtT=Math.max(0,game.hurtT-1);
    resetArm=Math.max(0,resetArm-1); resetDone=Math.max(0,resetDone-1);
    refundT=Math.max(0,refundT-1);
    updateParticles();
    if(tongue){ tongue.t--; if(tongue.t<=0) tongue=null; }

    if(game.paused) return;

    BALL_R = BALL_R_BASE * (fx.bigball>0?1.6:1) * (fx.shrink>0?0.6:1);
    PADDLE_W = PADDLE_W_BASE * (fx.bigpad>0?1.55:1) * (fx.shortpad>0?0.6:1);
    speedMul = (fx.slow>0?0.72:1) * (fx.fast>0?1.4:1);
    if(speedMul!==prevSpeedMul){ rescaleBalls(); prevSpeedMul=speedMul; }
    for(var i=0;i<FXKEYS.length;i++){ if(fx[FXKEYS[i]]>0) fx[FXKEYS[i]]--; }

    var target=paddle.targetX;
    if(pointerX!==null) target=pointerX;
    if(keys.left) target-=PADDLE_KEY_SPEED; if(keys.right) target+=PADDLE_KEY_SPEED;
    var half=PADDLE_W/2+WALL;
    paddle.targetX=Math.max(half,Math.min(VW-half,target));
    paddle.x+=(paddle.targetX-paddle.x)*0.55;

    for(i=0;i<balls.length;i++){ var b=balls[i];
      if(b.squash>0) b.squash=Math.max(0,b.squash-0.12);
      if(b.stuck){ b.x=Math.max(WALL+BALL_R,Math.min(VW-WALL-BALL_R, paddle.x+b.offset)); b.y=PADDLE_Y-BALL_R-1; } }

    // falling power-ups
    for(i=drops.length-1;i>=0;i--){ var d=drops[i]; d.y+=d.vy; d.t++;
      if(game.state===STATE.PLAY && d.y>=PADDLE_Y-6 && d.y<=PADDLE_Y+PADDLE_H+6 && Math.abs(d.x-paddle.x)<=PADDLE_W/2+7){
        activate(d.type); drops.splice(i,1); continue; }
      if(d.y>VH+10) drops.splice(i,1); }

    if(game.state===STATE.PLAY) stat.frames++;
    updateGun(); updateShots(); updateBolts();

    if(game.state===STATE.PLAY){ updateWall(); updateInvaders(); }
    updateBoss();

    if(game.state!==STATE.PLAY){ runBlasts(); return; }

    for(i=0;i<balls.length;i++){ var bb=balls[i]; if(bb.stuck) continue;
      bb.trail.push({x:bb.x,y:bb.y}); if(bb.trail.length>7) bb.trail.shift();
      var sp=Math.hypot(bb.vx,bb.vy), steps=Math.max(1,Math.ceil(sp/(BALL_R*0.5)));
      for(var s=0;s<steps;s++){ bb.x+=bb.vx/steps; bb.y+=bb.vy/steps;
        collideWalls(bb); collideNet(bb); collidePaddle(bb);
        if(collideInvaders(bb)) break;
        if(collideBoss(bb)) break;
        if(collideBricks(bb)) break; } }

    runBlasts();
    checkBreach();

    // Safety net for a ball that somehow tunnels past the back wall: charge for
    // it and put a fresh one on the paddle rather than stalling the stage.
    for(i=balls.length-1;i>=0;i--){ if(balls[i].y-BALL_R>VH+8){
      spawnDust(balls[i].x,VH-10,8); balls.splice(i,1); damage(DMG_DROP); } }
    if(game.state===STATE.PLAY && balls.length===0){ balls=[makeBall(true)]; game.state=STATE.READY; }
  }

  function collideWalls(b){
    if(b.x-BALL_R<WALL){ b.x=WALL+BALL_R; b.vx=Math.abs(b.vx); impact(b,1,0); blip(320,0.03,'square',0.04); }
    else if(b.x+BALL_R>VW-WALL){ b.x=VW-WALL-BALL_R; b.vx=-Math.abs(b.vx); impact(b,1,0); blip(320,0.03,'square',0.04); }
    if(b.y-BALL_R<TOP_Y){ b.y=TOP_Y+BALL_R; b.vy=Math.abs(b.vy); impact(b,0,1); blip(360,0.03,'square',0.04); }
    // The back wall keeps the ball in play and bills you for the miss.
    else if(b.y+BALL_R>BACK_Y && b.vy>0){
      b.y=BACK_Y-BALL_R; b.vy=-Math.abs(b.vy); impact(b,0,1);
      spawnDust(b.x,BACK_Y,10); damage(DMG_DROP);
    }
  }
  function collideNet(b){
    if(fx.safety>0 && b.vy>0 && b.y+BALL_R>=NET_Y){ b.y=NET_Y-BALL_R; b.vy=-Math.abs(b.vy); impact(b,0,1); blip(420,0.04,'sine',0.05); }
  }
  function collidePaddle(b){
    if(b.vy<=0) return;
    var px0=paddle.x-PADDLE_W/2, py=PADDLE_Y;
    if(b.x+BALL_R>px0 && b.x-BALL_R<px0+PADDLE_W && b.y+BALL_R>py && b.y-BALL_R<py+PADDLE_H){
      b.y=py-BALL_R; resetCombo();
      if(fx.sticky>0){ b.stuck=true; b.offset=b.x-paddle.x; b.vx=0; b.vy=0; impact(b,0,1); blip(440,0.05,'sine'); return; }
      var hit=Math.max(-1,Math.min(1,(b.x-paddle.x)/(PADDLE_W/2)));
      var ang=-Math.PI/2 + hit*(Math.PI/3), sp=Math.max(levelSpeed*speedMul, Math.hypot(b.vx,b.vy));
      b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; impact(b,0,1); blip(480,0.05,'square');
    }
  }
  function collideInvaders(b){
    dmgSrc='ball';
    for(var i=0;i<invaders.length;i++){ var v=invaders[i]; if(!v.alive) continue;
      var nx=Math.max(v.x,Math.min(b.x,v.x+INV_W)), ny=Math.max(v.y,Math.min(b.y,v.y+INV_H));
      var dx=b.x-nx, dy=b.y-ny;
      if(dx*dx+dy*dy<=BALL_R*BALL_R){
        var pierce=fx.pierce>0;
        if(!pierce){ if(Math.abs(dx)>Math.abs(dy)){ b.vx=-b.vx; impact(b,1,0);} else { b.vy=-b.vy; impact(b,0,1);} }
        tongue={ x:b.x, y:b.y, tx:v.x+INV_W/2, ty:v.y+INV_H/2, t:7 };
        if(pierce) killInvader(v); else hurtInvader(v, ballDamage());
        if(fx.bombball>0) detonate(v.x+INV_W/2, v.y+INV_H/2, BLAST_R*0.8);
        if(!pierce) return true;
      }
    }
    return false;
  }
  function collideBoss(b){
    if(!boss || boss.dead) return false;
    dmgSrc='ball';
    var nx=Math.max(boss.x,Math.min(b.x,boss.x+boss.w)), ny=Math.max(boss.y,Math.min(b.y,boss.y+boss.h));
    var dx=b.x-nx, dy=b.y-ny;
    if(dx*dx+dy*dy>BALL_R*BALL_R) return false;
    // The boss always bats the ball back; pierce doesn't cut through it. Push the
    // ball clear of the shallower axis so it can never end up trapped inside.
    var cx=boss.x+boss.w/2, cy=boss.y+boss.h/2;
    var ox=(boss.w/2+BALL_R)-Math.abs(b.x-cx), oy=(boss.h/2+BALL_R)-Math.abs(b.y-cy);
    if(ox<oy){ var sx=(b.x<cx?-1:1); b.x=cx+sx*(boss.w/2+BALL_R); b.vx=sx*Math.abs(b.vx); impact(b,1,0); }
    else { var sy=(b.y<cy?-1:1); b.y=cy+sy*(boss.h/2+BALL_R); b.vy=sy*Math.abs(b.vy); impact(b,0,1); }
    tongue={ x:b.x, y:b.y, tx:boss.x+boss.w/2, ty:boss.y+boss.h/2, t:7 };
    damageBoss(ballDamage()*(fx.bombball>0?2:1), true);
    return true;
  }
  function collideBricks(b){
    dmgSrc='ball';
    for(var i=0;i<game.bricks.length;i++){ var br=game.bricks[i]; if(!brickSolid(br)) continue;
      var nx=Math.max(br.x,Math.min(b.x,br.x+br.w)), ny=Math.max(br.y,Math.min(b.y,br.y+br.h));
      var dx=b.x-nx, dy=b.y-ny;
      if(dx*dx+dy*dy<=BALL_R*BALL_R){
        var pierce=fx.pierce>0;
        if(!pierce){ if(Math.abs(dx)>Math.abs(dy)){ b.vx=-b.vx; impact(b,1,0);} else { b.vy=-b.vy; impact(b,0,1);} }
        tongue={ x:b.x, y:b.y, tx:br.x+br.w/2, ty:br.y+br.h/2, t:7 };
        blip(560+Math.min(6,br.hp)*40, 0.05, 'square');
        if(pierce) breakBrick(br); else damageBrick(br, ballDamage());
        if(fx.bombball>0) detonate(br.x+br.w/2, br.y+br.h/2, BLAST_R*0.8);
        if(!pierce) return true;
      }
    }
    return false;
  }

  // ── rendering ──
  function px(v){ return Math.round(v); }
  function pad(n,w){ n=''+n; while(n.length<w) n='0'+n; return n; }
  function capsule(x,y,w,h){ var r=h/2; ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ── tappable buttons ──
  //  Every menu control is a plain rect so touch and mouse hit the same target
  //  and nothing here needs a keyboard.
  function inRect(r,x,y){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
  function drawBtn(r,label,key,on){
    ctx.lineWidth=1;
    if(on){ ctx.fillStyle='#fff'; ctx.fillRect(px(r.x),px(r.y),r.w,r.h); }
    ctx.strokeStyle='#fff'; ctx.strokeRect(px(r.x)+0.5,px(r.y)+0.5,r.w-1,r.h-1);
    ctx.fillStyle=on?'#000':'#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='10px ui-monospace, monospace';
    ctx.fillText(label, r.x+r.w/2, r.y+r.h/2+1);
    if(key){ ctx.globalAlpha=0.45; ctx.font='7px ui-monospace, monospace'; ctx.textAlign='right';
      ctx.fillText(key, r.x+r.w-5, r.y+r.h/2+1); ctx.globalAlpha=1; }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  // Pause / mute sit between the score (ends at x 82 with the combo badge) and
  // the level readout (starts at x 136); the health bar owns everything past
  // 193. Kept inside y 9..26 so the boxes clear the frame border and the divider.
  var HUD_BTN = { pause:{ x:92, y:10, w:14, h:14 }, mute:{ x:112, y:10, w:14, h:14 } };
  function pauseBtnLive(){ return game.state===STATE.PLAY || game.state===STATE.READY; }
  function hudBtnBox(r){
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1;
    ctx.strokeRect(px(r.x)+0.5,px(r.y)+0.5,r.w-1,r.h-1);
    ctx.fillStyle='rgba(255,255,255,0.75)';
  }
  function drawHudBtns(){
    var r, i;
    if(pauseBtnLive()){ r=HUD_BTN.pause; hudBtnBox(r);
      if(!game.paused){ ctx.fillRect(px(r.x+4),px(r.y+3),2,8); ctx.fillRect(px(r.x+8),px(r.y+3),2,8); }
      else for(i=0;i<4;i++) ctx.fillRect(px(r.x+5+i),px(r.y+3+i),1,8-i*2);
    }
    r=HUD_BTN.mute; hudBtnBox(r);
    ctx.fillRect(px(r.x+3),px(r.y+6),2,3); ctx.fillRect(px(r.x+5),px(r.y+4),2,7);
    if(allAudioOff()){ for(i=0;i<9;i++) ctx.fillRect(px(r.x+3+i),px(r.y+2+i),1,1); }
    else { ctx.fillRect(px(r.x+8),px(r.y+5),1,5); ctx.fillRect(px(r.x+10),px(r.y+4),1,7); }
  }

  function drawFrame(){
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    ctx.strokeRect(px(WALL)+0.5, px(WALL)+0.5, VW-WALL*2-1, VH-WALL*2-1);
    ctx.beginPath(); ctx.moveTo(WALL,HUD_H+0.5); ctx.lineTo(VW-WALL,HUD_H+0.5); ctx.stroke();
  }
  function drawFrogHead(cx,cy,sc){ ctx.fillStyle='#fff'; var u=sc;
    ctx.fillRect(px(cx-4*u),px(cy-1*u),8*u,5*u);
    ctx.fillRect(px(cx-4*u),px(cy-3*u),2*u,2*u); ctx.fillRect(px(cx+2*u),px(cy-3*u),2*u,2*u);
    ctx.fillStyle='#000'; ctx.fillRect(px(cx-4*u),px(cy-3*u),1*u,1*u); ctx.fillRect(px(cx+3*u),px(cy-3*u),1*u,1*u); }
  function drawHUD(){
    ctx.fillStyle='#fff'; ctx.textBaseline='middle';
    ctx.font='10px ui-monospace, monospace'; ctx.textAlign='left';
    ctx.fillText('SC '+pad(game.score,5), WALL+5, HUD_H/2+1);
    ctx.textAlign='center';
    ctx.fillText('LV '+(game.level+1)+'/'+LEVELS.length, VW/2, HUD_H/2+1);
    if(game.mult>1){ ctx.textAlign='left'; ctx.globalAlpha=0.5+0.5*Math.abs(Math.sin(blinkT*0.18));
      ctx.font='9px ui-monospace, monospace'; ctx.fillText('x'+game.mult, WALL+62, HUD_H/2+1); ctx.globalAlpha=1; }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    drawHudBtns();
    drawHealth();
    drawMeter();
  }
  // One segment per hit you can still take, so the bar reads as a countdown
  // rather than a percentage. It also visibly lengthens as MAX HP is bought.
  function drawHealth(){
    var x=204, y=10, h=8, seg=4, gap=1, max=maxHp();
    drawFrogHead(196, HUD_H/2, 0.8);

    inv:function(){return invaders;},LEVELS:LEVELS,openSelect:openSelect,maxHp:maxHp};
  canvas.addEventListener('pointerdown', function(e){
    var r=canvas.getBoundingClientRect(), vx=toVirtualX(e.clientX);
    var vy=(e.clientY!==undefined)?(((e.clientY-r.top)/r.height)*VH):0;
    // HUD controls win over everything, in every screen.
    if(vy<HUD_H){
      if(inRect(HUD_BTN.mute,vx,vy)){ toggleAllAudio(); return; }
      if(pauseBtnLive() && inRect(HUD_BTN.pause,vx,vy)){ togglePause(); return; }
    }
    if(game.state===STATE.SELECT){
      if(inRect(selBackRect(),vx,vy)){ closeSelect(); return; }
      var hit=selHitTest(vx,vy);
      if(hit>=0){ selIdx=hit; chooseLevel(hit); }
      return; }
    if(game.state===STATE.SHOP){
      var s=shopHitTest(vx,vy);
      if(s>=0){ shopIdx=s; shopActivate(s); }
      return; }
    if(game.state===STATE.SUMMARY){
      var u=sumHitTest(vx,vy);
      if(u>=0){ sumIdx=u; sumActivate(u); }
      return; }
    if(game.state===STATE.OPTIONS){
      var o=optHitTest(vx,vy);
      if(o>=0){ optIdx=o; optActivate(o); }
      return; }
    if(game.state===STATE.TITLE||game.state===STATE.OVER||game.state===STATE.WIN){
      var mb=menuBtns();
      if(inRect(mb[0],vx,vy)){ openShop(0); return; }
      if(inRect(mb[1],vx,vy)){ openSelect(); return; }
      if(inRect(mb[2],vx,vy)){ openOptions(); return; }
    }
    pointerX=vx;
    primaryAction(); });
  function hoverMenu(e){
    var r=canvas.getBoundingClientRect();
    var vx=toVirtualX(e.clientX), vy=((e.clientY-r.top)/r.height)*VH;
    if(game.state===STATE.SELECT){ var h=selHitTest(vx,vy); if(h>=0) selIdx=h; return false; }
    if(game.state===STATE.SHOP){ var s=shopHitTest(vx,vy); if(s>=0) shopIdx=s; return false; }
    if(game.state===STATE.SUMMARY){ var u=sumHitTest(vx,vy); if(u>=0) sumIdx=u; return false; }
    if(game.state===STATE.OPTIONS){ var o=optHitTest(vx,vy); if(o>=0) optIdx=o; return false; }
    return true;
  }
  window.addEventListener('pointermove', function(e){ if(!hoverMenu(e)) return;
    if(e.pointerType==='mouse'&&e.buttons===0&&game.state===STATE.TITLE) return; pointerX=toVirtualX(e.clientX); });
  window.addEventListener('mousemove', function(e){ if(!hoverMenu(e)) return; pointerX=toVirtualX(e.clientX); });
  window.addEventListener('keydown', function(e){
    if(game.state===STATE.SELECT){
      if(e.code==='ArrowLeft'||e.code==='KeyA'){ e.preventDefault(); moveSel(-1,0); return; }
      if(e.code==='ArrowRight'||e.code==='KeyD'){ e.preventDefault(); moveSel(1,0); return; }
      if(e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); moveSel(0,-1); return; }
      if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); moveSel(0,1); return; }
      if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); chooseLevel(selIdx); return; }
      if(e.code==='Escape'||e.code==='KeyL'){ closeSelect(); return; }
      return;
    }
    if(game.state===STATE.SHOP){
      if(e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); moveShop(-1); return; }
      if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); moveShop(1); return; }
      if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); shopActivate(shopIdx); return; }
      if(e.code==='Escape'||e.code==='KeyU'){ closeShop(); return; }
      return;
    }
    if(game.state===STATE.OPTIONS){
      if(e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); optIdx=(optIdx+3)%4; blip(420,0.02,'square',0.03); return; }
      if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); optIdx=(optIdx+1)%4; blip(420,0.02,'square',0.03); return; }
      if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); optActivate(optIdx); return; }
      if(e.code==='Escape'||e.code==='KeyO'){ closeOptions(); return; }
      return;
    }
    if(game.state===STATE.SUMMARY){
      if(e.code==='ArrowLeft'||e.code==='KeyA'){ e.preventDefault(); sumIdx=0; blip(420,0.02,'square',0.03); return; }
      if(e.code==='ArrowRight'||e.code==='KeyD'){ e.preventDefault(); sumIdx=1; blip(420,0.02,'square',0.03); return; }
      if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); sumActivate(sumIdx); return; }
      if(e.code==='KeyU'){ openShop(1); return; }
      return;
    }
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ keys.left=true; pointerX=null; }
    if(e.code==='ArrowRight'||e.code==='KeyD'){ keys.right=true; pointerX=null; }
    if(e.code==='Space'){ e.preventDefault(); primaryAction(); }
    if(e.code==='KeyM'){ toggleAllAudio(); }
    if(e.code==='KeyL'){ if(game.state===STATE.TITLE||game.state===STATE.OVER||game.state===STATE.WIN) openSelect(); }
    if(e.code==='KeyU'){ if(game.state===STATE.TITLE||game.state===STATE.OVER||game.state===STATE.WIN) openShop(0); }
    if(e.code==='KeyO'){ if(game.state===STATE.TITLE||game.state===STATE.OVER||game.state===STATE.WIN) openOptions(); }
    if(e.code==='KeyP'){ togglePause(); } });
  window.addEventListener('keyup', function(e){
    if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
    if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false; });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });

})();
</script>
</body>
</html>
